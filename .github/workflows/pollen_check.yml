name: Daily Barcelona Pollen Check

on:
  schedule:
    # Runs at 7:00 AM UTC every day (9:00 AM Barcelona time in summer, 8:00 AM in winter)
    - cron: "0 7 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  pollen-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pollen checker
        run: python pollen_checker.py

      - name: Commit pollen history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pollen_history.csv
          git diff --staged --quiet || git commit -m "Add pollen data for $(date +%Y-%m-%d)"
          git push

      - name: Send ntfy notification
        run: |
          REPORT=$(python -c "
          from pollen_checker import fetch_forecast_xml, parse_forecast, format_short_summary
          xml = fetch_forecast_xml()
          forecast = parse_forecast(xml)
          print(format_short_summary(forecast))
          ")
          curl -s \
            -H "Title: Barcelona Pollen Report" \
            -H "Tags: sunflower" \
            -d "$REPORT" \
            ntfy.sh/barcelona-pollen-ryban3z
